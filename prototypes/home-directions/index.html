<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyTrolley — Home screen directions</title>
<style>
:root{
  --forest:#0A2417; --forest-deep:#071811; --forest-2:#125135; --forest-3:#18583D;
  --lime:#B6DF0A; --lime-2:#C2E500; --olive:#40591D;
  --ivory:#FDF9EE; --cream:#FAF8EF; --paper:#FBF7F0;
  --sage:#E6EADA; --sage-2:#EEF1E7; --stone:#F3F1ED;
  --ink:#0C1711; --muted:#5C6B60;
  --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; background:#E8E4DB; color:#3C423D; font-family:var(--sans);
  display:flex; flex-direction:column; align-items:center;
  padding:84px 20px 120px; -webkit-font-smoothing:antialiased;
}
.harness{text-align:center; margin-bottom:20px}
.harness-kicker{font-size:10px; letter-spacing:.18em; font-weight:800; color:#8A8F86; margin:0 0 5px}
.harness-sub{font-size:12.5px; color:#7A8078; margin:0}
.phone{
  width:390px; height:844px; flex:none; border-radius:48px; padding:10px; position:relative;
  background:linear-gradient(150deg,#232B25,#080B09 55%);
  box-shadow:0 50px 90px -30px rgba(12,32,20,.45), 0 20px 40px -20px rgba(12,32,20,.3), inset 0 0 0 1px rgba(255,255,255,.08);
}
.screen{position:relative; width:100%; height:100%; border-radius:38px; overflow:hidden; background:#fff}
.screen::after{
  content:""; position:absolute; top:10px; left:50%; width:9px; height:9px; border-radius:50%;
  background:#050807; transform:translateX(-50%); z-index:60; box-shadow:0 0 0 1.5px rgba(255,255,255,.06);
}
.app{position:absolute; inset:0; overflow:hidden; font-size:14px; font-family:var(--sans)}
:where(.app) button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit}
.app button:focus-visible,.app [role="button"]:focus-visible{outline:2px solid var(--lime); outline-offset:2px}
.app input:focus-visible{outline:0}
.v1-search:focus-within{border-color:var(--forest); box-shadow:0 0 0 3px rgba(10,36,23,.07)}
.v2-search:focus-within{border-color:var(--forest); box-shadow:0 0 0 3px rgba(10,36,23,.07)}
.v3-search:focus-within{border-color:rgba(182,223,10,.55); background:rgba(255,255,255,.09)}
.app img{display:block}
.app-scroll{position:absolute; top:30px; left:0; right:0; bottom:var(--nav-h,0); overflow-y:auto; overflow-x:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.app-scroll::-webkit-scrollbar{display:none}
.statusbar{position:absolute; top:0; left:0; right:0; height:30px; z-index:10; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:11px; font-weight:600}
.sb-dark{color:#14251B}
.sb-light{color:rgba(253,249,238,.92)}
.sb-icons{display:flex; align-items:center; gap:5px}
.ic{display:block; flex:none}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@keyframes heroIn{from{opacity:.4; transform:scale(1.025)} to{opacity:1; transform:none}}
@keyframes fade{from{opacity:0} to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(102%)} to{transform:none}}
@keyframes detailIn{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
.quiet .anim{animation:none !important}
.quiet .v1-hero,.quiet .v3-hero{animation:none !important}
@media (prefers-reduced-motion: reduce){
  .anim,.v1-hero,.v3-hero,.sheet,.backdrop,.detail{animation:none !important}
}

/* ============ VARIANT 1 — MARKET HALL ============ */
.v1{background:var(--paper); color:var(--ink); --nav-h:78px}
.v1-head{padding:10px 16px 15px; background:var(--forest); border-radius:0 0 24px 24px; color:var(--ivory)}
.v1-top{display:flex; align-items:center; justify-content:space-between}
.v1-logo{display:inline-flex; align-items:center; background:transparent; border-radius:0; padding:0; box-shadow:none}
.v1-logo img{height:22px; width:auto; display:block}
.v1-bag{width:36px; height:36px; border-radius:50%; border:0; background:#15533A; display:grid; place-items:center; color:#fff; position:relative}
.badge{position:absolute; top:-3px; right:-3px; min-width:18px; height:18px; border-radius:99px; background:var(--lime); color:var(--forest); font-size:10px; font-weight:800; display:grid; place-items:center; padding:0 4px; border:2px solid var(--paper); line-height:1}
.v1-head .badge{border-color:var(--forest)}
.v1-store{display:flex; align-items:center; gap:7px; margin-top:14px; width:100%; padding:0; color:#fff}
.v1-store .pin{color:#fff; display:flex}
.v1-store strong{font-size:13.5px; font-weight:600; color:#fff; letter-spacing:0}
.v1-store .chev{margin-left:2px; color:#fff; opacity:.9; display:flex}
.v1-searchrow{display:flex; gap:9px; margin-top:12px}
.v1-search{flex:1; min-width:0; height:38px; display:flex; align-items:center; gap:9px; padding:0 13px; background:var(--ivory); border:0; border-radius:999px; color:var(--forest-2)}
.v1-search input{flex:1; min-width:0; border:0; outline:0; background:none; font-size:12.5px; color:var(--ink)}
.v1-search input::placeholder{color:#8A8F86}
.v1-search .clear{display:grid; place-items:center; width:20px; height:20px; border-radius:50%; background:rgba(10,36,23,.08); color:var(--forest)}
.v1-filter{width:38px; height:38px; border-radius:50%; background:var(--ivory); border:0; display:grid; place-items:center; color:var(--forest); flex:none}
.v1-hero{position:relative; height:176px; margin:12px 14px 0; overflow:hidden; border-radius:18px; background:var(--forest); animation:heroIn 300ms cubic-bezier(.23,1,.32,1) both}
.v1-hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.v1-hero .shade{position:absolute; inset:0; background:linear-gradient(90deg,rgba(6,22,14,.58) 0%,rgba(6,22,14,.18) 48%,rgba(6,22,14,0) 64%)}
.v1-hero .copy{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 16px; width:64%}
.v1-kicker{font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--lime); font-weight:800; margin-bottom:5px}
.v1-hero h2{font-family:var(--serif); font-size:25px; line-height:1.04; color:var(--ivory); margin:0; font-weight:400; letter-spacing:-.01em}
.v1-hero p{font-size:10.5px; line-height:1.35; color:rgba(253,249,238,.76); margin:7px 0 9px}
.v1-cta{align-self:flex-start; background:var(--lime); color:var(--forest); font-size:11.5px; font-weight:800; padding:8px 13px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
.v1-dots{display:flex; justify-content:center; gap:6px; padding:9px 0 7px}
.v1-dot{height:5px; width:5px; border-radius:99px; background:rgba(10,36,23,.22); transition:width 200ms ease-out, background 200ms ease-out}
.v1-dot[aria-current="true"]{width:18px; background:var(--forest)}
.v1-section{padding:14px 16px 0}
.v1-section-head,.v1-rec-head{display:flex; align-items:baseline; justify-content:space-between}
.v1-section-head{margin-bottom:10px}
.v1-section-head h2,.v1-rec-head h2{font-family:var(--serif); font-weight:400; color:var(--forest); margin:0; letter-spacing:-.01em}
.v1-section-head h2{font-size:21px}
.v1-rec-head{padding:18px 16px 10px}
.v1-rec-head h2{font-size:23px}
.v1-link{font-size:11px; font-weight:800; color:var(--olive); border-bottom:1px solid rgba(64,89,29,.35); padding-bottom:1px}
.v1-rail{display:flex; gap:13px; overflow-x:auto; margin:0 -16px; padding:0 16px 4px; scrollbar-width:none}
.v1-rail::-webkit-scrollbar{display:none}
.v1-aisle{flex:none; width:64px; display:flex; flex-direction:column; align-items:center; gap:6px}
.v1-aisle .disc{width:62px; height:62px; border-radius:50%; background:#FBE7D5; overflow:hidden; border:1px solid rgba(10,36,23,.08); box-shadow:0 2px 6px rgba(10,36,23,.08); display:grid; place-items:center}
.v1-aisle img{width:100%; height:100%; object-fit:cover}
.v1-aisle .disc.all{background:var(--forest); color:var(--ivory)}
.v1-aisle.active .disc{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--forest)}
.v1-aisle span{font-size:10.5px; font-weight:700; color:var(--forest); text-align:center; line-height:1.15}
.v1-aisle small{font-size:9px; color:var(--muted); font-weight:500}
.v1-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px}
.v1-card{position:relative; background:var(--ivory); border:1px solid rgba(10,36,23,.08); border-radius:18px; overflow:hidden; text-align:left; animation:rise 260ms cubic-bezier(.23,1,.32,1) both; animation-delay:calc(var(--i,0) * 35ms); cursor:pointer}
.v1-photo{height:126px; background:#FBE7D5}
.v1-photo img{width:100%; height:100%; object-fit:cover}
.v1-body{padding:9px 11px 11px}
.v1-cat{font-size:8.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:var(--olive); margin-bottom:3px}
.v1-name{font-size:13.5px; line-height:1.15; font-weight:700; color:var(--ink); margin:0; letter-spacing:-.01em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:31px}
.v1-unit{font-size:10px; color:var(--muted); margin-top:2px}
.v1-foot{display:flex; align-items:flex-end; justify-content:space-between; gap:6px; margin-top:7px}
.v1-price{font-size:13.5px; font-weight:800; color:var(--forest)}
.v1-stock{font-size:9px; color:var(--muted); display:flex; align-items:center; gap:4px; margin-top:2px}
.v1-stock::before{content:""; width:4px; height:4px; border-radius:50%; background:#6C9A3E}
.v1-stock.out::before{background:#C25A4A}
.v1-add{width:27px; height:27px; border-radius:50%; border:1px solid rgba(10,36,23,.25); display:grid; place-items:center; color:var(--forest); flex:none; transition:transform 140ms cubic-bezier(.23,1,.32,1)}
.v1-add:active{transform:scale(.92)}
.v1-oos{font-size:8.5px; font-weight:800; color:#A4483A; text-transform:uppercase; letter-spacing:.08em}
.v1-stepper{display:flex; align-items:center; gap:1px; background:var(--forest); color:var(--ivory); border-radius:999px; height:27px; padding:0 3px; flex:none}
.v1-stepper button{width:21px; height:21px; display:grid; place-items:center; color:var(--ivory)}
.v1-stepper span{font-size:11px; font-weight:800; min-width:11px; text-align:center}
.v1-note{margin:14px 16px 26px; padding:11px 13px; background:rgba(230,234,218,.55); border-radius:14px; display:flex; gap:8px; align-items:center; font-size:10.5px; color:#4E5C52; line-height:1.3}
.v1-note .dot{width:6px; height:6px; border-radius:50%; background:#79A33F; flex:none}
.v1-note strong{color:var(--forest)}
.v1-note button{margin-left:auto; font-size:10.5px; font-weight:800; color:var(--olive); flex:none}
.v1-empty{text-align:center; padding:34px 24px 26px}
.v1-empty .em{width:46px; height:46px; border-radius:50%; background:rgba(10,36,23,.06); display:grid; place-items:center; margin:0 auto 10px; color:var(--forest)}
.v1-empty h3{font-family:var(--serif); font-weight:400; font-size:17px; margin:0 0 4px; color:var(--forest)}
.v1-empty p{font-size:11px; color:var(--muted); margin:0 0 10px}
.v1-nav{position:absolute; bottom:0; left:0; right:0; height:78px; z-index:8; background:rgba(251,247,240,.96); border-top:1px solid rgba(10,36,23,.09); display:flex; align-items:flex-start; padding:8px 8px 0; backdrop-filter:blur(8px)}
.v1-tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:52px; justify-content:center; color:rgba(10,36,23,.5); position:relative}
.v1-tab span{font-size:9.5px; font-weight:600}
.v1-tab.active{color:var(--forest)}
.v1-tab.active::after{content:""; position:absolute; bottom:-1px; width:4px; height:4px; border-radius:50%; background:var(--lime)}
.v1-nav .center{width:54px; flex:none; margin:0 4px; display:flex; justify-content:center}
.v1-bagfab{width:52px; height:52px; border-radius:50%; background:var(--forest); color:var(--ivory); display:grid; place-items:center; margin-top:-22px; border:3px solid var(--paper); box-shadow:0 6px 14px rgba(10,36,23,.25); position:relative}
.v1-bagfab.active{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--lime),0 6px 14px rgba(10,36,23,.25)}
/* ============ VARIANT 2 — QUICK SHOP ============ */
.v2{background:#F2F4EE; color:var(--ink); --nav-h:64px}
.v2-head{position:sticky; top:0; z-index:6; background:#F2F4EE; padding:9px 16px 10px}
.v2-top{display:flex; align-items:center; gap:8px}
.v2-logo{background:var(--forest); border-radius:9px; padding:5px 8px}
.v2-logo img{height:17px; width:auto}
.v2-storepill{margin-left:auto; display:flex; align-items:center; gap:5px; height:34px; padding:0 10px; background:#fff; border:1px solid rgba(10,36,23,.12); border-radius:999px; font-size:11.5px; font-weight:700; color:var(--forest); max-width:170px}
.v2-storepill span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.v2-bag{width:34px; height:34px; border-radius:50%; background:#fff; border:1px solid rgba(10,36,23,.12); display:grid; place-items:center; color:var(--forest); position:relative; flex:none}
.v2-bag .badge{border-color:#F2F4EE; top:-4px; right:-4px}
.v2-searchrow{display:flex; gap:7px; margin-top:9px}
.v2-search{flex:1; min-width:0; height:42px; display:flex; align-items:center; gap:8px; padding:0 12px; background:#fff; border:1px solid rgba(10,36,23,.12); border-radius:13px; color:var(--forest-2)}
.v2-search input{flex:1; min-width:0; border:0; outline:0; background:none; font-size:13px; color:var(--ink)}
.v2-search input::placeholder{color:#7C887E}
.v2-search .clear{display:grid; place-items:center; width:19px; height:19px; border-radius:50%; background:rgba(10,36,23,.08); color:var(--forest)}
.v2-filter{width:42px; height:42px; border-radius:13px; background:var(--forest); color:var(--ivory); display:grid; place-items:center; flex:none}
.v2-summary{margin:2px 16px 14px; padding:9px 12px; background:#E4EDCF; border-radius:11px; display:flex; align-items:center; gap:7px; font-size:10.5px; color:#3E5127; font-weight:600}
.v2-summary .dot{width:6px; height:6px; border-radius:50%; background:#5E8A2E; flex:none}
.v2-summary strong{font-weight:800}
.v2-summary button{margin-left:auto; font-size:10.5px; font-weight:800; color:var(--forest); text-decoration:underline; flex:none}
.v2-quick{margin-bottom:15px}
.v2-qhead{display:flex; justify-content:space-between; align-items:baseline; padding:0 16px 9px}
.v2-qhead h2{font-size:15px; font-weight:800; margin:0; letter-spacing:-.01em}
.v2-qhead button{font-size:10.5px; font-weight:800; color:var(--olive)}
.v2-qrail{display:flex; gap:9px; overflow-x:auto; padding:0 16px 4px; scrollbar-width:none}
.v2-qrail::-webkit-scrollbar{display:none}
.v2-qcard{flex:none; width:132px; background:#fff; border:1px solid rgba(10,36,23,.09); border-radius:14px; padding:7px 7px 9px; text-align:left; animation:rise 240ms cubic-bezier(.23,1,.32,1) both; animation-delay:calc(var(--i,0) * 30ms); cursor:pointer}
.v2-qphoto{height:82px; border-radius:9px; background:#FBE7D5; overflow:hidden}
.v2-qphoto img{width:100%; height:100%; object-fit:cover}
.v2-qname{font-size:11.5px; font-weight:700; margin:6px 0 1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.v2-qfoot{display:flex; justify-content:space-between; align-items:center; gap:4px; margin-top:3px}
.v2-qprice{font-size:11.5px; font-weight:800; color:var(--forest)}
.v2-qadd{width:23px; height:23px; border-radius:50%; background:var(--forest); color:var(--ivory); display:grid; place-items:center; flex:none}
.v2-qstepper{display:flex; align-items:center; gap:1px; background:var(--forest); color:var(--ivory); border-radius:99px; height:23px; padding:0 2px; flex:none}
.v2-qstepper button{width:18px; height:18px; display:grid; place-items:center; color:var(--ivory)}
.v2-qstepper span{font-size:10px; font-weight:800; min-width:9px; text-align:center}
.v2-chips{display:flex; gap:7px; overflow-x:auto; padding:0 16px 12px; scrollbar-width:none}
.v2-chips::-webkit-scrollbar{display:none}
.v2-chip{flex:none; height:34px; padding:0 12px; border-radius:999px; background:#fff; border:1px solid rgba(10,36,23,.11); font-size:11.5px; font-weight:700; color:#4C5B50; display:flex; align-items:center; gap:5px}
.v2-chip b{font-size:9.5px; font-weight:700; color:#8B958C}
.v2-chip.active{background:var(--forest); border-color:var(--forest); color:var(--ivory)}
.v2-chip.active b{color:rgba(253,249,238,.6)}
.v2-listhead{display:flex; align-items:center; gap:7px; padding:2px 16px 9px}
.v2-listhead h2{font-size:17px; font-weight:800; margin:0; letter-spacing:-.02em}
.v2-listhead .count{font-size:10.5px; color:#7A857B}
.v2-sort{margin-left:auto; height:28px; padding:0 9px; border-radius:8px; background:#fff; border:1px solid rgba(10,36,23,.12); font-size:10px; font-weight:700; color:var(--forest); display:flex; align-items:center; gap:4px; flex:none}
.v2-rows{display:flex; flex-direction:column; gap:8px; padding:0 16px 22px}
.v2-row{display:flex; gap:10px; background:#fff; border:1px solid rgba(10,36,23,.09); border-radius:14px; padding:8px; align-items:center; text-align:left; animation:rise 240ms cubic-bezier(.23,1,.32,1) both; animation-delay:calc(var(--i,0) * 18ms); cursor:pointer}
.v2-rphoto{width:68px; height:68px; border-radius:10px; background:#FBE7D5; overflow:hidden; flex:none}
.v2-rphoto img{width:100%; height:100%; object-fit:cover}
.v2-rinfo{flex:1; min-width:0}
.v2-rname{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.v2-runit{font-size:10px; color:#7A857B; margin-top:1px}
.v2-rprice{font-size:13px; font-weight:800; color:var(--forest); margin-top:5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.v2-rstock{font-size:9px; font-weight:600; color:#6F7C71; display:flex; align-items:center; gap:3px}
.v2-rstock::before{content:""; width:4px; height:4px; border-radius:50%; background:#6C9A3E}
.v2-rstock.out::before{background:#C25A4A}
.v2-add{width:30px; height:30px; border-radius:50%; background:var(--forest); color:var(--ivory); display:grid; place-items:center; flex:none}
.v2-stepper{display:flex; align-items:center; gap:1px; background:var(--forest); color:var(--ivory); border-radius:999px; height:30px; padding:0 3px; flex:none}
.v2-stepper button{width:23px; height:23px; display:grid; place-items:center; color:var(--ivory)}
.v2-stepper span{font-size:11px; font-weight:800; min-width:11px; text-align:center}
.v2-oos{font-size:8px; font-weight:800; color:#A4483A; text-transform:uppercase; letter-spacing:.06em; flex:none; max-width:34px; line-height:1.1; text-align:center}
.v2-empty{text-align:center; padding:30px 24px 26px}
.v2-empty h3{font-size:14px; font-weight:800; margin:0 0 4px}
.v2-empty p{font-size:11px; color:#7A857B; margin:0 0 10px}
.v2-empty button{font-size:11px; font-weight:800; color:var(--forest); text-decoration:underline}
.v2-nav{position:absolute; bottom:0; left:0; right:0; height:64px; background:var(--forest); display:flex; align-items:center; padding:0 6px; z-index:8}
.v2-tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:rgba(253,249,238,.5); font-size:9px; font-weight:600}
.v2-tab.active{color:var(--lime)}
.v2-nav .center{flex:none; width:52px; display:grid; place-items:center}
.v2-fab{width:46px; height:46px; border-radius:50%; background:var(--lime); color:var(--forest); display:grid; place-items:center; margin-top:-16px; border:3px solid #F2F4EE; position:relative}
/* ============ VARIANT 3 — AFTER HOURS ============ */
.v3{background:radial-gradient(120% 58% at 50% 0%,#143F29 0%,#0B2418 42%,#06140D 100%); color:var(--ivory); --nav-h:0px}
.v3 .app-scroll{bottom:0; padding-bottom:104px}
.v3-head{padding:6px 16px 8px}
.v3-top{display:flex; align-items:center; justify-content:space-between}
.v3-logo img{height:27px; width:auto}
.v3-bag{width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); display:grid; place-items:center; color:var(--ivory); position:relative}
.v3-bag .badge{border-color:#0B2418}

/* ============ PICKER (verbatim spec) ============ */
.proto-picker{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:2147483647; display:flex; align-items:center; gap:2px; padding:4px; border-radius:999px; background:rgba(10,10,10,.82); -webkit-backdrop-filter:blur(12px) saturate(1.4); backdrop-filter:blur(12px) saturate(1.4); box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:13px; line-height:1; -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none}
.proto-picker-highlight{position:absolute; top:4px; left:0; height:28px; border-radius:999px; background:rgba(255,255,255,.12)}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion: reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative; display:flex; align-items:center; height:28px; padding:0 12px; border:0; border-radius:999px; background:transparent; color:rgba(255,255,255,.55); font:inherit; cursor:pointer; transition:color 150ms ease-out,transform 160ms cubic-bezier(.23,1,.32,1)}
@media (hover:hover) and (pointer:fine){.proto-picker-item:hover{color:rgba(255,255,255,.85)}}
.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4); outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px; height:16px; margin:0 4px; background:rgba(255,255,255,.12)}
.proto-picker-replay{padding:0 10px; font-size:14px}
.proto-picker[data-position="top"]{bottom:auto; top:24px}
</style>
</head>
<body>
<header class="harness">
  <p class="harness-kicker">MYTROLLEY · HOME SCREEN</p>
  <p class="harness-sub">Three directions, one shop. Flip with 1–3 or ← →.</p>
</header>
<main class="phone" aria-label="MyTrolley home screen prototype">
  <div class="screen" id="stage"></div>
</main>

<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Market Hall</button>
  <button class="proto-picker-item">Quick Shop</button>
  <button class="proto-picker-item">After Hours</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
/* ---------- data ---------- */
const STORES = [
  { id: 1, name: 'Marina Walk', code: 'MW-01', factor: 1.00 },
  { id: 2, name: 'Jumeirah 1', code: 'JM-04', factor: 1.04 },
  { id: 3, name: 'Al Reem Island', code: 'AR-02', factor: 0.97 }
];
const CATS = [
  { id: 'vegetables', name: 'Vegetables', count: 48, img: 'broccoli' },
  { id: 'fruits', name: 'Fruits', count: 36, img: 'oranges' },
  { id: 'dairy', name: 'Dairy', count: 22, img: 'milk' },
  { id: 'bakery', name: 'Bakery', count: 18, img: 'croissant' },
  { id: 'nonveg', name: 'Non-veg', count: 27, img: 'salmon' },
  { id: 'groceries', name: 'Groceries', count: 64, img: 'rice' },
  { id: 'electronics', name: 'Electronics', count: 15, img: 'headphones' }
];
const PRODUCTS = [
  { id: 1, name: 'Broccoli Crown', cat: 'vegetables', unit: 'per 500 g', price: 6.75, img: 'broccoli', stock: { 1: 24, 2: 12, 3: 0 }, origin: 'UAE', diet: 'Vegetarian', storage: 'Chilled', desc: 'Tight, deep-green florets with sweet stems. Steam for four minutes or roast with olive oil and lemon.' },
  { id: 2, name: 'Vine Tomatoes', cat: 'vegetables', unit: 'per 1 kg', price: 4.50, img: 'tomatoes', stock: { 1: 40, 2: 18, 3: 26 }, origin: 'UAE', diet: 'Vegetarian', storage: 'Room temperature', desc: 'Vine-ripened and heavy for their size. Bright acidity, good for salads and slow sauces.' },
  { id: 3, name: 'Baby Carrots', cat: 'vegetables', unit: 'per 500 g', price: 3.25, img: 'carrots', stock: { 1: 32, 2: 0, 3: 14 }, origin: 'UAE', diet: 'Vegetarian', storage: 'Chilled', desc: 'Sweet, snap-fresh carrots with a fine crunch. Ideal for roasting, slaw or juice.' },
  { id: 4, name: 'Globe Eggplant', cat: 'vegetables', unit: 'per 1 kg', price: 5.20, img: 'eggplant', stock: { 1: 11, 2: 6, 3: 9 }, origin: 'UAE', diet: 'Vegetarian', storage: 'Cool, dry', desc: 'Glossy, dense and mild. Salt the slices before grilling to keep them tender.' },
  { id: 5, name: 'Navel Oranges', cat: 'fruits', unit: 'per 1 kg', price: 7.90, img: 'oranges', stock: { 1: 28, 2: 22, 3: 0 }, origin: 'South Africa', diet: 'Vegetarian', storage: 'Cool, dry', desc: 'Thin-skinned navels, easy to peel and full of juice. Sweet with a clean finish.' },
  { id: 6, name: 'Green Grapes', cat: 'fruits', unit: 'per 500 g', price: 12.50, img: 'grapes', stock: { 1: 16, 2: 9, 3: 12 }, origin: 'India', diet: 'Vegetarian', storage: 'Chilled', desc: 'Crisp green grapes, seedless and chilled. A clean, honeyed sweetness.' },
  { id: 7, name: 'Golden Kiwi', cat: 'fruits', unit: 'pack of 4', price: 9.75, img: 'kiwi', stock: { 1: 6, 2: 0, 3: 4 }, origin: 'New Zealand', diet: 'Vegetarian', storage: 'Cool, dry', desc: 'Golden kiwi with a smooth, tropical sweetness. Ripe and ready to eat.' },
  { id: 8, name: 'Fresh Milk', cat: 'dairy', unit: '1 L bottle', price: 6.50, img: 'milk', stock: { 1: 18, 2: 24, 3: 10 }, origin: 'UAE', diet: 'Vegetarian', storage: 'Chilled', desc: 'Fresh whole milk from a local dairy. Creamy, clean and lightly sweet.' },
  { id: 9, name: 'Aged Cheddar', cat: 'dairy', unit: '250 g block', price: 18.00, img: 'cheese', stock: { 1: 9, 2: 4, 3: 0 }, origin: 'UK', diet: 'Vegetarian', storage: 'Chilled', desc: 'Aged twelve months for a firm bite and a long, savoury finish.' },
  { id: 10, name: 'Greek Yogurt', cat: 'dairy', unit: '500 g tub', price: 7.25, img: 'yogurt', stock: { 1: 14, 2: 11, 3: 7 }, origin: 'UAE', diet: 'Vegetarian', storage: 'Chilled', desc: 'Thick Greek-style yogurt, strained for body. Serve with fruit or use in marinades.' },
  { id: 11, name: 'Butter Croissant', cat: 'bakery', unit: 'each', price: 4.50, img: 'croissant', stock: { 1: 12, 2: 0, 3: 8 }, origin: 'In-store', diet: 'Vegetarian', storage: 'Room temperature', desc: 'Laminated with cultured butter, baked golden this morning. Crisp outside, soft within.' },
  { id: 12, name: 'Sourdough Loaf', cat: 'bakery', unit: '650 g', price: 12.00, img: 'sourdough', stock: { 1: 7, 2: 5, 3: 3 }, origin: 'In-store', diet: 'Vegetarian', storage: 'Room temperature', desc: 'A slow-fermented loaf with a blistered crust and an open, tangy crumb.' },
  { id: 13, name: 'Salmon Fillet', cat: 'nonveg', unit: 'per 500 g', price: 42.00, img: 'salmon', stock: { 1: 5, 2: 0, 3: 2 }, origin: 'Norway', diet: 'Non-vegetarian', storage: 'Chilled', desc: 'Atlantic salmon, hand-cut and boneless. Rich, clean flavour; excellent pan-seared.' },
  { id: 14, name: 'Chicken Breast', cat: 'nonveg', unit: 'per 1 kg', price: 24.50, img: 'chicken', stock: { 1: 9, 2: 7, 3: 0 }, origin: 'UAE', diet: 'Non-vegetarian', storage: 'Chilled', desc: 'Free-range chicken breast, trimmed and boneless. Lean, tender and quick to cook.' },
  { id: 15, name: 'Basmati Rice', cat: 'groceries', unit: '2 kg jar', price: 15.75, img: 'rice', stock: { 1: 20, 2: 14, 3: 16 }, origin: 'India', diet: 'Vegetarian', storage: 'Cool, dry', desc: 'Long-grain basmati, aged for aroma. Cooks separate and fluffy.' },
  { id: 16, name: 'Red Lentils', cat: 'groceries', unit: '500 g', price: 8.40, img: 'lentils', stock: { 1: 26, 2: 19, 3: 22 }, origin: 'Turkey', diet: 'Vegetarian', storage: 'Cool, dry', desc: 'Split red lentils that soften quickly into soups and dal.' },
  { id: 17, name: 'Rolled Oats', cat: 'groceries', unit: '1 kg', price: 11.90, img: 'oats', stock: { 1: 13, 2: 8, 3: 11 }, origin: 'UK', diet: 'Vegetarian', storage: 'Cool, dry', desc: 'Whole rolled oats for porridge and baking. Nutty, hearty and high in fibre.' },
  { id: 18, name: 'Wireless Headphones', cat: 'electronics', unit: 'each', price: 349.00, img: 'headphones', stock: { 1: 3, 2: 2, 3: 0 }, origin: 'Imported', diet: '—', storage: 'Dry', desc: 'Over-ear wireless headphones with active noise cancelling and 30-hour battery life.' },
  { id: 19, name: 'Portable Speaker', cat: 'electronics', unit: 'each', price: 199.00, img: 'speaker', stock: { 1: 4, 2: 0, 3: 6 }, origin: 'Imported', diet: '—', storage: 'Dry', desc: 'Compact portable speaker with a woven shell, deep bass and 12-hour playback.' }
];
const HEROES = [
  { img: 'assets/banner_fruits.png', cat: 'fruits', kicker: 'Aisle 02 · Fruits', title: 'A burst of sunshine', action: 'Explore fruits' },
  { img: 'assets/banner_vegetables.png', cat: 'vegetables', kicker: 'Aisle 01 · Vegetables', title: 'Colour your plate', action: 'Explore vegetables' },
  { img: 'assets/banner_dairy.png', cat: 'dairy', kicker: 'Aisle 03 · Dairy', title: 'Creamy little comforts', action: 'Explore dairy' },
  { img: 'assets/banner_bakery.png', cat: 'bakery', kicker: 'Aisle 04 · Bakery', title: 'Flaky, golden layers', action: 'Explore bakery' },
  { img: 'assets/banner_nonveg.png', cat: 'nonveg', kicker: 'Aisle 05 · Non-veg', title: 'What’s for dinner?', action: 'Explore non-veg' },
  { img: 'assets/banner_groceries.png', cat: 'groceries', kicker: 'Aisle 06 · Groceries', title: 'Stock your pantry', action: 'Explore groceries' },
  { img: 'assets/banner_electronics.png', cat: 'electronics', kicker: 'Aisle 07 · Electronics', title: 'Turn up the sound', action: 'Explore electronics' }
];
const IMG = {};
PRODUCTS.forEach(p => IMG[p.img] = 'assets/' + p.img + '.png');

/* ---------- icons ---------- */
const ICONS = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/>',
  filter: '<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.1" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="2.1" fill="currentColor" stroke="none"/><circle cx="8" cy="17" r="2.1" fill="currentColor" stroke="none"/>',
  bag: '<path d="M5.5 8h13l-1 11.5a2 2 0 0 1-2 1.5H8.5a2 2 0 0 1-2-1.5L5.5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>',
  pin: '<path d="M12 21s7-5.8 7-11a7 7 0 1 0-14 0c0 5.2 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/>',
  home: '<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1v-9.5Z"/>',
  grid: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/>',
  box: '<path d="M12 3.5 20 8v8l-8 4.5L4 16V8l8-4.5Z"/><path d="m4 8 8 4.5L20 8M12 12.5V20"/>',
  chev: '<path d="m9 5 7 7-7 7"/>',
  chevDown: '<path d="m5 9 7 7 7-7"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  close: '<path d="m6 6 12 12M18 6 6 18"/>',
  back: '<path d="M19 12H5m0 0 6-6m-6 6 6 6"/>',
  arrow: '<path d="M4 12h16m0 0-6-6m6 6-6 6"/>'
};
function icon(name, size) {
  size = size || 20;
  return '<svg class="ic" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
}
function statusBar(v) {
  const light = v === 3;
  return '<div class="statusbar ' + (light ? 'sb-light' : 'sb-dark') + '">' +
    '<span>9:41</span>' +
    '<span class="sb-icons">' +
      '<svg width="15" height="10" viewBox="0 0 15 10" fill="currentColor" aria-hidden="true"><rect x="0" y="6" width="2.4" height="4" rx=".6"/><rect x="4" y="4" width="2.4" height="6" rx=".6"/><rect x="8" y="2" width="2.4" height="8" rx=".6"/><rect x="12" y="0" width="2.4" height="10" rx=".6"/></svg>' +
      '<svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M1 3.2a9 9 0 0 1 12 0M3.4 5.7a5.6 5.6 0 0 1 7.2 0M5.9 8.1a2 2 0 0 1 2.2 0"/></svg>' +
      '<svg width="21" height="10" viewBox="0 0 21 10" fill="none" aria-hidden="true"><rect x=".6" y=".6" width="17.5" height="8.8" rx="2.4" stroke="currentColor" stroke-opacity=".5"/><rect x="2.4" y="2.4" width="13" height="5.2" rx="1.2" fill="currentColor"/><path d="M20 3.4v3.2" stroke="currentColor" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/></svg>' +
    '</span></div>';
}

/* ---------- state ---------- */
const state = {
  storeId: 1, page: 'home', categoryId: null, query: '', sort: 'default',
  detailId: null, sheet: false, sheetChoice: 1,
  hero: { 1: 1, 3: 0 }, trolley: {}, quiet: false
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = () => STORES.find(s => s.id === state.storeId);
const catName = id => (CATS.find(c => c.id === id) || {}).name || 'All';
const priceOf = p => Math.round(p.price * store().factor * 20) / 20;
const money = n => 'AED ' + n.toFixed(2);
const stockOf = p => p.stock[state.storeId] || 0;
const qty = id => (state.trolley[state.storeId] || {})[id] || 0;
const trolleyCount = () => Object.values(state.trolley[state.storeId] || {}).reduce((a, b) => a + b, 0);
const bagBadge = () => { const c = trolleyCount(); return c ? '<span class="badge">' + c + '</span>' : ''; };
function stockLabel(p) {
  const s = stockOf(p);
  if (s === 0) return { text: 'Out of stock', out: true };
  if (s <= 5) return { text: 'Only ' + s + ' left', out: false };
  return { text: s + ' in stock', out: false };
}
const SORT_LABEL = { default: 'Recommended', low: 'Price: low', high: 'Price: high', name: 'Name A–Z' };
function listProducts() {
  const q = state.query.trim().toLowerCase();
  let list = PRODUCTS.filter(p => {
    if (state.categoryId && p.cat !== state.categoryId) return false;
    if (!q) return true;
    return (p.name + ' ' + catName(p.cat) + ' ' + p.unit).toLowerCase().includes(q);
  });
  if (state.sort === 'low') list.sort((a, b) => priceOf(a) - priceOf(b));
  if (state.sort === 'high') list.sort((a, b) => priceOf(b) - priceOf(a));
  if (state.sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
  return list;
}
function heroOf(v) { return HEROES[state.hero[v]]; }
function heroTitle(h) {
  const w = h.title.split(' ');
  const last = w.pop();
  return esc(w.join(' ')) + ' <em>' + esc(last) + '</em>';
}
function heroDots(v) {
  const idx = state.hero[v];
  return '<div class="v' + v + '-dots">' + HEROES.map((h, i) =>
    '<button class="v' + v + '-dot" data-act="hero-dot" data-i="' + i + '"' + (i === idx ? ' aria-current="true"' : '') + ' aria-label="' + esc(h.title) + '"></button>'
  ).join('') + '</div>';
}
/* ---------- shared bits ---------- */
function control1(p) {
  if (stockOf(p) === 0) return '<span class="v1-oos">Out</span>';
  const q = qty(p.id);
  if (q > 0) return '<div class="v1-stepper"><button data-act="dec" data-id="' + p.id + '" aria-label="Remove one">' + icon('minus', 12) + '</button><span>' + q + '</span><button data-act="inc" data-id="' + p.id + '" aria-label="Add one">' + icon('plus', 12) + '</button></div>';
  return '<button class="v1-add" data-act="inc" data-id="' + p.id + '" aria-label="Add ' + esc(p.name) + '">' + icon('plus', 14) + '</button>';
}
function control2(p, small) {
  if (stockOf(p) === 0) return '<span class="v2-oos">Out</span>';
  const q = qty(p.id);
  if (q > 0) return '<div class="' + (small ? 'v2-qstepper' : 'v2-stepper') + '"><button data-act="dec" data-id="' + p.id + '" aria-label="Remove one">' + icon('minus', small ? 10 : 12) + '</button><span>' + q + '</span><button data-act="inc" data-id="' + p.id + '" aria-label="Add one">' + icon('plus', small ? 10 : 12) + '</button></div>';
  return '<button class="' + (small ? 'v2-qadd' : 'v2-add') + '" data-act="inc" data-id="' + p.id + '" aria-label="Add ' + esc(p.name) + '">' + icon('plus', small ? 11 : 14) + '</button>';
}
function control3(p) {
  if (stockOf(p) === 0) return '<span class="v3-oos">Out</span>';
  const q = qty(p.id);
  if (q > 0) return '<div class="v3-stepper"><button data-act="dec" data-id="' + p.id + '" aria-label="Remove one">' + icon('minus', 11) + '</button><span>' + q + '</span><button data-act="inc" data-id="' + p.id + '" aria-label="Add one">' + icon('plus', 11) + '</button></div>';
  return '<button class="v3-add" data-act="inc" data-id="' + p.id + '" aria-label="Add ' + esc(p.name) + '">' + icon('plus', 14) + '</button>';
}
function empty1() {
  return '<div class="v1-empty"><div class="em">' + icon('search', 22) + '</div><h3>No products match “' + esc(state.query) + '”</h3><p>Try another search, or browse the full catalogue.</p><button class="v1-link" data-act="clear">Clear filters</button></div>';
}
function empty2() {
  return '<div class="v2-empty"><h3>No products match “' + esc(state.query) + '”</h3><p>Try another search, or clear the filters.</p><button data-act="clear">Clear filters</button></div>';
}
function empty3() {
  return '<div class="v3-empty"><div class="em">' + icon('search', 22) + '</div><h3>No products match “' + esc(state.query) + '”</h3><p>Try another search, or browse the full catalogue.</p><button data-act="clear">Clear filters</button></div>';
}
function visibleCats() {
  const q = state.query.trim().toLowerCase();
  return CATS.filter(c => !q || c.name.toLowerCase().includes(q));
}
function aisleCount() { return CATS.reduce((a, c) => a + c.count, 0); }

/* ---------- variant 1: Market Hall ---------- */
function header1() {
  return '<header class="v1-head">' +
    '<div class="v1-top">' +
      '<button class="v1-logo" data-act="nav" data-page="home" aria-label="MyTrolley home"><img src="assets/mytrolley-logo.png" alt="MyTrolley"></button>' +
      '<button class="v1-bag" data-act="nav" data-page="products" aria-label="Open catalogue">' + icon('bag', 20) + bagBadge() + '</button>' +
    '</div>' +
    '<button class="v1-store" data-act="store">' +
      '<span class="pin">' + icon('pin', 16) + '</span>' +
      '<strong>MyTrolley ' + esc(store().name) + '</strong>' +
      '<span class="chev">' + icon('chevDown', 12) + '</span>' +
    '</button>' +
    '<div class="v1-searchrow">' +
      '<label class="v1-search">' + icon('search', 16) +
        '<input data-search value="' + esc(state.query) + '" placeholder="' + (state.page === 'categories' ? 'Search categories' : 'Search groceries') + '" aria-label="Search">' +
        (state.query ? '<button class="clear" data-act="clear-search" aria-label="Clear search">' + icon('close', 11) + '</button>' : '') +
      '</label>' +
      '<button class="v1-filter" data-act="nav" data-page="categories" aria-label="Browse categories">' + icon('filter', 18) + '</button>' +
    '</div>' +
  '</header>';
}
function tab1(page, label, ic) {
  const on = (page === 'stores' && state.sheet) || state.page === page;
  return '<button class="v1-tab' + (on ? ' active' : '') + '" data-act="nav" data-page="' + page + '"' + (on ? ' aria-current="page"' : '') + '>' + icon(ic, 20) + '<span>' + label + '</span></button>';
}
function nav1() {
  return '<nav class="v1-nav" aria-label="Primary">' +
    tab1('home', 'Home', 'home') + tab1('categories', 'Categories', 'grid') +
    '<div class="center"><button class="v1-bagfab' + (state.page === 'products' ? ' active' : '') + '" data-act="nav" data-page="products" aria-label="Catalogue">' + icon('bag', 24) + bagBadge() + '</button></div>' +
    tab1('products', 'Catalogue', 'box') + tab1('stores', 'Stores', 'pin') +
  '</nav>';
}
function aisle1() {
  return '<section class="v1-section">' +
    '<div class="v1-section-head"><h2>Shop by aisle</h2><button class="v1-link" data-act="see-all">See all</button></div>' +
    '<div class="v1-rail">' +
      '<button class="v1-aisle' + (!state.categoryId ? ' active' : '') + '" data-act="chip" data-cat=""><span class="disc all">' + icon('grid', 24) + '</span><span>All</span><small>' + PRODUCTS.length + '</small></button>' +
      CATS.map(c => '<button class="v1-aisle' + (state.categoryId === c.id ? ' active' : '') + '" data-act="chip" data-cat="' + c.id + '"><span class="disc"><img src="' + IMG[c.img] + '" alt=""></span><span>' + c.name + '</span><small>' + c.count + '</small></button>').join('') +
    '</div>' +
  '</section>';
}
function card1(p, i) {
  const s = stockLabel(p);
  return '<article class="v1-card" data-act="open" data-id="' + p.id + '" style="--i:' + i + '" role="button" tabindex="0" aria-label="View ' + esc(p.name) + '">' +
    '<div class="v1-photo"><img src="' + IMG[p.img] + '" alt=""></div>' +
    '<div class="v1-body">' +
      '<div class="v1-cat">' + catName(p.cat) + '</div>' +
      '<h3 class="v1-name">' + esc(p.name) + '</h3>' +
      '<div class="v1-unit">' + esc(p.unit) + '</div>' +
      '<div class="v1-foot"><div><div class="v1-price">' + money(priceOf(p)) + '</div><div class="v1-stock' + (s.out ? ' out' : '') + '">' + s.text + '</div></div>' + control1(p) + '</div>' +
    '</div>' +
  '</article>';
}
function rec1(limit) {
  const all = listProducts();
  const list = limit ? all.slice(0, limit) : all;
  const heading = state.query ? 'Results for “' + esc(state.query) + '”' : state.categoryId ? catName(state.categoryId) : 'Recommended';
  return '<div class="v1-rec-head"><h2>' + heading + '</h2><button class="v1-link" data-act="see-all">See all</button></div>' +
    (list.length ? '<div class="v1-grid">' + list.map(card1).join('') + '</div>' : empty1());
}
function chips1() {
  return '<div class="v1-chips">' +
    '<button class="v1-chip' + (!state.categoryId ? ' active' : '') + '" data-act="chip" data-cat="">All<small>' + PRODUCTS.length + '</small></button>' +
    CATS.map(c => '<button class="v1-chip' + (state.categoryId === c.id ? ' active' : '') + '" data-act="chip" data-cat="' + c.id + '">' + c.name + '<small>' + c.count + '</small></button>').join('') +
  '</div>';
}
function productsBlock1() {
  const all = listProducts();
  const heading = state.query ? 'Results for “' + esc(state.query) + '”' : state.categoryId ? catName(state.categoryId) : 'All products';
  return '<div class="v1-products-head"><div><h2>' + heading + '</h2><span>' + all.length + ' items · ' + esc(store().name) + '</span></div><button class="v1-sort" data-act="sort">Sort · ' + SORT_LABEL[state.sort] + '</button></div>' +
    (all.length ? '<div class="v1-grid">' + all.map(card1).join('') + '</div>' : empty1());

/* ---------- app shell ---------- */
function pageMarkup(v) {
  const header = v === 1 ? header1() : v === 2 ? header2() : header3();
  if (state.page === 'categories') return header + (v === 1 ? categories1() : v === 2 ? categories2() : categories3());
  if (state.page === 'products') return header + (v === 1 ? products1() : v === 2 ? products2() : products3());
  return header + (v === 1 ? home1() : v === 2 ? home2() : home3());
}
function appMarkup(v) {

    (v === 1 ? nav1() : v === 2 ? nav2() : nav3()) +
    (state.sheet ? sheetMarkup() : '') +
    (state.detailId ? detailMarkup() : '') +
  '</div>';
}
/* ---------- behaviour ---------- */
const stage = document.getElementById('stage');
const variants = [() => appMarkup(1), () => appMarkup(2), () => appMarkup(3)];
let current = 0;

function render(opts) {
  opts = opts || {};
  const sc = stage.querySelector('.app-scroll');
  const top = sc ? sc.scrollTop : 0;
  const ds = stage.querySelector('.detail-scroll');
  const dtop = ds ? ds.scrollTop : 0;
  stage.innerHTML = variants[current]();
  const nsc = stage.querySelector('.app-scroll');
  if (nsc && opts.keepScroll !== false) nsc.scrollTop = top;
  const nd = stage.querySelector('.detail-scroll');
  if (nd) nd.scrollTop = dtop;
}
function productsBlock3() {
  const all = listProducts();
  const heading = state.query ? 'Results for “' + esc(state.query) + '”' : state.categoryId ? catName(state.categoryId) : 'All products';
  return '<div class="v3-sec-head"><h2>' + heading + '</h2><button data-act="sort">Sort · ' + SORT_LABEL[state.sort] + '</button></div>' +
    (all.length ? '<div class="v3-grid">' + all.map(card3).join('') + '</div>' : empty3());
}
function refreshResults() {
  const region = stage.querySelector('[data-results]');
  if (!region) return;
  const v = current + 1;
  let html;
  if (state.page === 'categories') {
    const list = visibleCats();
    if (v === 1) html = list.length ? '<div class="v1-catgrid">' + list.map(catCard1).join('') + '</div>' : empty1();
    else if (v === 2) html = list.length ? '<div class="v2-catgrid">' + list.map(catCard2).join('') + '</div>' : empty2();
    else html = list.length ? '<div class="v3-catgrid">' + list.map(catCard3).join('') + '</div>' : empty3();
  } else if (state.page === 'products') {
    html = v === 1 ? productsBlock1() : v === 2 ? list2() : productsBlock3();
  } else {
    html = v === 1 ? rec1(6) : v === 2 ? list2() : rec3(6);
  }
  region.innerHTML = html;
}
function setPage(page) {
  if (page === 'stores') { state.sheet = true; state.sheetChoice = state.storeId; state.quiet = true; render(); return; }
  state.page = page;
  state.detailId = null;
  state.sheet = false;
  state.query = '';
  state.quiet = false;
  if (page === 'home' || page === 'products') state.categoryId = null;
  render();
}
function selectCategory(cat) {
  state.categoryId = cat || null;
  state.page = 'products';
  state.detailId = null;
  state.sheet = false;
  state.quiet = false;
  render();
}
function pickStore(id) {
  state.sheetChoice = id;
  stage.querySelectorAll('.store-row').forEach(r => {
    const on = +r.dataset.id === id;
    r.classList.toggle('selected', on);
    r.setAttribute('aria-checked', String(on));
  });
  const cta = stage.querySelector('[data-confirm]');
  const s = STORES.find(x => x.id === id);
  if (cta && s) cta.textContent = 'Shop ' + s.name;
}
function confirmStore() {
  state.storeId = state.sheetChoice;
  state.sheet = false;
  state.quiet = true;
  render();
}
function changeQty(id, d) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  const max = stockOf(p);
  if (max <= 0) return;
  const next = Math.max(0, Math.min(max, qty(id) + d));
  const group = state.trolley[state.storeId] || (state.trolley[state.storeId] = {});
  if (next === 0) delete group[id]; else group[id] = next;
  state.quiet = true;
  render();
}
function cycleSort() {
  const order = ['default', 'low', 'high', 'name'];
  state.sort = order[(order.indexOf(state.sort) + 1) % order.length];
  state.quiet = true;
  render();
}
stage.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || !stage.contains(t)) return;
  const act = t.dataset.act;
  if (act === 'nav') setPage(t.dataset.page);
  else if (act === 'store') { state.sheet = true; state.sheetChoice = state.storeId; state.quiet = true; render(); }
  else if (act === 'close-sheet') { state.sheet = false; render(); }
  else if (act === 'pick-store') pickStore(+t.dataset.id);
  else if (act === 'confirm-store') confirmStore();
  else if (act === 'chip' || act === 'banner') selectCategory(t.dataset.cat || null);
  else if (act === 'hero-dot') { state.hero[current + 1] = +t.dataset.i; state.quiet = true; render(); }
  else if (act === 'open') { state.detailId = +t.dataset.id; state.quiet = false; render(); }
  else if (act === 'back') { state.detailId = null; state.quiet = false; render(); }
  else if (act === 'inc') changeQty(+t.dataset.id, 1);
  else if (act === 'dec') changeQty(+t.dataset.id, -1);
  else if (act === 'sort') cycleSort();
  else if (act === 'clear') { state.query = ''; state.categoryId = null; state.quiet = true; render(); }
  else if (act === 'clear-search') { state.query = ''; state.quiet = true; render(); }
  else if (act === 'see-all') { state.categoryId = null; state.page = 'products'; state.detailId = null; state.quiet = false; render(); }
});
stage.addEventListener('input', e => {
  if (!e.target.matches('[data-search]')) return;
  const prev = state.query;
  const next = e.target.value;
  state.query = next;
  state.quiet = true;
  if (state.page === 'home' && (!!prev !== !!next)) {
    render();
    const sc = stage.querySelector('.app-scroll');
    if (sc) sc.scrollTop = 0;
    const input = stage.querySelector('[data-search]');
    if (input) { input.focus(); input.setSelectionRange(next.length, next.length); }
  } else {
    refreshResults();
  }
});
stage.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (state.sheet) { state.sheet = false; render(); }
    else if (state.detailId) { state.detailId = null; render(); }
  }
  if (e.key === 'Enter' && e.target.matches('[data-search]')) e.target.blur();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act="open"]')) { e.preventDefault(); e.target.click(); }
});

/* ---------- picker wiring ---------- */
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');

function moveHighlight() {
  const el = items[current];
  if (!el) return;
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = 'translateX(' + el.offsetLeft + 'px)';
}
function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => {
    state.quiet = false;
    state.sheet = false;
    state.detailId = null;
    stage.innerHTML = variants[i]();
  });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

</script>
</body>
